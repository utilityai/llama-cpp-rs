name: Llama Cpp Rs Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  check:
    name: Run Tests on LLama Cpp Rs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -vv
      - name: Fmt
        run: cargo fmt --check
      - name: Build
        run: cargo build --features sampler,mtmd,llguidance -vv
      - name: Test
        run: cargo test --features sampler,mtmd,llguidance
      - name: Dry-Run Publishing
        run: RUST_BACKTRACE=1 cargo publish --workspace --verbose --dry-run
  arm64:
    name: Check that it builds on various targets (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    strategy:
      matrix:
        include:
          - name: linux/arm64
            runner: ubuntu-26.04-arm
            cuda-repo: ubuntu2604/sbsa
          - name: linux/amd64
            runner: ubuntu-26.04 # x86_64
            cuda-repo: ubuntu2604/x86_64
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Compile Deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run:
          sudo apt-get update && sudo apt-get install -y build-essential curl libssl-dev libclang-dev pkg-config cmake git ccache
      - name: Install CUDA Toolkit
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda-repo }}/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-13-4
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ccache
      - name: Build
        run: cargo build --bin simple --features cuda -vv
      - run: ccache --show-stats
  mac:
    name: Check that it builds on mac
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --features sampler,mtmd,llguidance -vv
  windows:
    name: Check that it builds on windows (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: msvc
            os: windows-latest
          - name: clang-cl
            os: windows-latest
            cc: clang-cl.exe
          - name: clang-cl arm64
            os: windows-11-arm
            cc: clang-cl.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Use ${{ matrix.cc }}
        if: matrix.cc
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cc }}" >> "$GITHUB_ENV"
          # The Visual Studio generator ignores CC/CXX and always uses cl.exe
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --features sampler,mtmd,llguidance -vv
      - name: Test
        run: cargo test --features sampler,mtmd,llguidance
  emscripten:
    name: Check that building for Emscripten works
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Install Emscripten
        run: |
          EMSCRIPTEN_VERSION="6.0.9"
          git clone https://github.com/emscripten-core/emsdk.git --branch ${EMSCRIPTEN_VERSION}
          ./emsdk/emsdk install ${EMSCRIPTEN_VERSION}
          ./emsdk/emsdk activate ${EMSCRIPTEN_VERSION}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        # Needs to use build-std, see:
        # https://doc.rust-lang.org/rustc/platform-support/wasm32-unknown-emscripten.html#emscripten-abi-compatibility
        run: |
          source ./emsdk/emsdk_env.sh
          export CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_LINKER=em++
          cargo +nightly -Zbuild-std build --target wasm32-unknown-emscripten --features sampler,mtmd,llguidance -vv
